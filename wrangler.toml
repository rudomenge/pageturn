# Cloudflare Worker voor Bladerboek. Zie README voor de stappen in het dashboard.
name = "pageturn"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

# Eigen adres; menge.nl staat in hetzelfde Cloudflare-account.
routes = [{ pattern = "book.menge.nl", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "pageturn"

[observability]
enabled = true
