# Cloudflare Worker voor Bladerboek. Zie README voor de stappen in het dashboard.
name = "bladerboek"
main = "worker/index.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "pageturn"

[observability]
enabled = true
