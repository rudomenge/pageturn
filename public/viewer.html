<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bladerboek</title>
<link rel="stylesheet" href="viewer.css">
<script src="vendor/page-flip.browser.js"></script>
</head>
<body class="env-studio">
<main class="layout">
  <section class="stage" id="stage">
    <div class="dropzone" id="dropzone" hidden>
      <div class="dz-inner">
        <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M12 11v6m-3-3h6"/></svg>
        <h1>Sleep je PDF hierheen</h1>
        <p>of <label class="link">kies een bestand<input type="file" id="fileInput" accept="application/pdf,.pdf" hidden></label></p>
        <label class="check"><select id="coverModeSelect">
          <option value="outer">Eerste en laatste pagina zijn de omslag</option>
          <option value="full">Omslag én binnenkant omslag zitten in de PDF</option>
          <option value="none">Geen omslag in de PDF</option>
        </select></label>
      </div>
    </div>

    <div class="loading" id="loading" hidden>
      <div class="spinner"></div>
      <div id="loadingText">Boek wordt geladen…</div>
      <div class="bar"><i id="loadingBar"></i></div>
    </div>

    <div class="book-area" id="bookArea">
      <button class="side-arrow prev" id="sidePrev" title="Vorige pagina (←)" aria-label="Vorige pagina" hidden>
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="side-arrow next" id="sideNext" title="Volgende pagina (→)" aria-label="Volgende pagina" hidden>
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <div class="book-host" id="bookHost">
        <div class="board board-left" id="boardLeft"></div>
        <div class="board board-right" id="boardRight"></div>
        <div class="spine-mid" id="spineMid"></div>
        <div class="block block-left" id="blockLeft"></div>
        <div class="block block-right" id="blockRight"></div>
        <div class="flip-root-slot" id="flipSlot"></div>
        <div class="staples" id="staples"><i></i><i></i></div>
        <div class="pin-layer" id="pinLayer"></div>
        <div class="pick-layer" id="pickLayer" hidden></div>
      </div>
    </div>

    <a class="fab home-fab" id="homeBtn" href="/" title="Terug naar je boeken" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="mode-badge" id="modeBadge" hidden></div>
    <div class="fab-bar">
      <div class="menu edit-menu" id="editMenu" hidden>
        <button class="fab" id="editBtn" title="Bewerken (alleen voor jou)" aria-label="Bewerken" aria-haspopup="true" aria-expanded="false" aria-controls="editPop">
          <svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></svg>
        </button>
        <div class="menu-pop edit-pop" id="editPop" hidden>
          <div class="menu-group">
            <div class="menu-label">Bewerken · alleen voor jou</div>
            <label class="ed-field">Uitvoering
              <select id="edBinding"><option value="hardcover">Hardcover</option><option value="softcover">Softcover</option><option value="magazine">Magazine</option></select>
            </label>
            <div class="ed-row">
              <label class="ed-field">Papier g/m²<input id="edGsm" inputmode="numeric" placeholder="standaard"></label>
              <label class="ed-field">Soort
                <select id="edPaper"><option value="gloss">Glans (mc)</option><option value="silk">Mat / silk</option><option value="uncoated">Ongestreken</option><option value="bulky">Romandruk</option></select>
              </label>
            </div>
            <label class="ed-field" id="edCoverModeWrap">Omslag in de PDF
              <select id="edCoverMode"><option value="outer">Eerste en laatste pagina</option><option value="full">Incl. binnenkant omslag</option><option value="none">Geen omslag in de PDF</option></select>
            </label>
            <label class="ed-field ed-color" id="edHeadbandWrap">Kapitaalband <input type="color" id="edHeadband" value="#ffffff"></label>
          </div>
          <div class="menu-group" id="edFiles">
            <div class="menu-label">Bestanden</div>
          </div>
          <div class="ed-status" id="edStatus" role="status"></div>
        </div>
      </div>
      <div class="menu">
        <button class="fab" id="menuBtn" title="Opties" aria-label="Opties" aria-haspopup="true" aria-expanded="false" aria-controls="menuPop">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <div class="menu-pop" id="menuPop" hidden>
          <div class="menu-group" id="bindingSeg" role="group" aria-label="Uitvoering">
            <div class="menu-label">Uitvoering</div>
            <button data-binding="hardcover">Hardcover</button>
            <button data-binding="softcover">Softcover</button>
            <button data-binding="magazine">Magazine</button>
          </div>
          <div class="menu-group" id="envGroup" role="group" aria-label="Achtergrond">
            <div class="menu-label">Achtergrond</div>
            <div class="swatches">
              <button data-env="studio" title="Licht" aria-label="Licht"><i></i><span>Licht</span></button>
              <button data-env="linen" title="Zand" aria-label="Zand"><i></i><span>Zand</span></button>
              <button data-env="grey" title="Grijs" aria-label="Grijs"><i></i><span>Grijs</span></button>
              <button data-env="dark" title="Donker" aria-label="Donker"><i></i><span>Donker</span></button>
            </div>
          </div>
          <div class="menu-group">
            <a class="menu-item" id="downloadBtn" hidden download>
              <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 19h16"/></svg>PDF downloaden
            </a>
            <button class="menu-item" id="fullscreenBtn">
              <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Volledig scherm
            </button>
          </div>
        </div>
      </div>
      <button class="fab comments-fab" id="commentsBtn" title="Opmerkingen" aria-label="Opmerkingen" aria-controls="panel" aria-expanded="false" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><b id="commentCount"></b>
      </button>
    </div>
    <aside class="panel" id="panel" role="dialog" aria-label="Opmerkingen" hidden>
      <div class="panel-head">
        <h2>Opmerkingen</h2>
        <button class="btn icon" id="closePanel" title="Sluiten">✕</button>
      </div>
      <div class="filters" id="filters">
        <button data-filter="spread" class="on">Deze pagina's</button>
        <button data-filter="all">Alle</button>
        <button data-filter="general">Algemeen</button>
      </div>
      <ul class="comments" id="commentList"></ul>
      <form class="compose" id="composeForm">
        <button type="button" class="btn pin-btn" id="pinBtn">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6-5.6-6-11a6 6 0 1112 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2"/></svg>
          Prik een opmerking op de pagina
        </button>
        <label>Over
          <select id="aboutSelect"></select>
        </label>
        <textarea id="commentText" rows="3" placeholder="Schrijf een opmerking…" required></textarea>
        <div class="row">
          <input id="authorInput" placeholder="Je naam" autocomplete="name">
          <button class="btn primary" type="submit">Plaatsen</button>
        </div>
      </form>
    </aside>
    <div class="navbar" id="navbar" hidden>
      <div class="key-hint" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd><span>bladeren met de pijltjestoetsen</span></div>
      <div class="nav-controls">
      <button class="nav" id="firstBtn" title="Naar omslag">⇤</button>
      <button class="nav" id="prevBtn" title="Vorige">‹</button>
      <input type="range" id="pageSlider" min="0" max="0" value="0" aria-label="Pagina">
      <span class="pageinfo" id="pageInfo"></span>
      <button class="nav" id="nextBtn" title="Volgende">›</button>
      <button class="nav" id="lastBtn" title="Naar achterkant">⇥</button>
      </div>
      <div class="placard" id="placard" hidden>
        <div class="pl-title" id="plTitle"></div>
        <div class="pl-line" id="plFormat"></div>
        <div class="pl-line" id="plExtent"></div>
      </div>
    </div>
  </section>

</main>

<div class="popover" id="pinPopover" hidden>
  <div class="pp-title" id="pinPopTitle">Opmerking op pagina</div>
  <textarea id="pinText" rows="3" placeholder="Wat wil je hier opmerken?"></textarea>
  <input id="pinAuthor" placeholder="Je naam" autocomplete="name">
  <div class="row">
    <button class="btn" id="pinCancel" type="button">Annuleren</button>
    <button class="btn primary" id="pinSave" type="button">Plaatsen</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="viewer.js"></script>
</body>
</html>
